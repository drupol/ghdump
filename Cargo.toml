[package]
name = "ghdump"
version = "0.1.2"
edition = "2024"
authors = ["Pol Dellaiera <pol.dellaiera@protonmail.com>"]
homepage = "https://github.com/drupol/ghdump"
repository = "https://github.com/drupol/ghdump"
readme = "README.md"
license = "EUPL-1.2"
keywords = ["github", "export", "cli"]
categories = ["command-line-utilities", "development-tools"]
description = "Export GitHub issues, pull requests, and discussions through customizable templates."

[dependencies]
anyhow = "1.0.100"
futures = "0.3.32"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
minijinja = { version = "2.12.0", features = ["json"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
url = "2.5.7"
